<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Свежий помол — кофейные сорта у прилавка</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#3d2f22;padding:18px;font-family:'PT Sans',sans-serif}
  .board{
    background:#1F2A24;
    border:14px solid #6B4A2F;
    border-radius:6px;
    box-shadow:inset 0 0 60px rgba(0,0,0,.55), inset 0 0 8px rgba(0,0,0,.8), 0 14px 40px rgba(0,0,0,.5);
    color:#F3EFE4;
    max-width:880px;margin:0 auto;
    padding:30px 26px 34px;
    position:relative;
    overflow:hidden;
  }
  .board::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 20% 10%,rgba(243,239,228,.05),transparent 45%),
               radial-gradient(ellipse at 85% 80%,rgba(243,239,228,.04),transparent 40%);
    border-radius:2px}
  h1{font-family:'Caveat',cursive;font-size:clamp(38px,7vw,64px);margin:0;color:#F3EFE4;
     text-shadow:0 0 6px rgba(243,239,228,.25);transform:rotate(-1.5deg)}
  .sub{font-family:'Caveat',cursive;font-size:22px;color:#F5D76E;transform:rotate(.6deg);margin:4px 0 18px}
  /* мел-навигация */
  nav{display:flex;flex-wrap:wrap;gap:14px 22px;margin-bottom:10px}
  nav a{font-family:'Caveat',cursive;font-size:26px;color:#F3EFE4;text-decoration:none;
    text-shadow:0 0 5px rgba(243,239,228,.2)}
  nav a:nth-child(1){transform:rotate(-1deg)}
  nav a:nth-child(2){transform:rotate(.8deg);color:#E8A0A0}
  nav a:nth-child(3){transform:rotate(-.5deg)}
  nav a:nth-child(4){transform:rotate(1.2deg);color:#F5D76E}
  nav a:hover{text-shadow:0 0 10px rgba(243,239,228,.6)}
  .arrow{font-family:'Caveat';color:rgba(243,239,228,.4);font-size:20px}
  h2{font-family:'Caveat',cursive;font-size:32px;margin:34px 0 6px;transform:rotate(-.8deg);
     text-decoration:underline wavy rgba(243,239,228,.35);text-underline-offset:6px}
  /* сорта */
  .sorts{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
  @media(max-width:640px){.sorts{grid-template-columns:1fr}}
  .sort{border-bottom:1px dashed rgba(243,239,228,.25);padding:12px 2px}
  .sort h3{font-family:'Caveat',cursive;font-size:26px;margin:0;transform:rotate(-.4deg)}
  .origin{font-size:13px;color:rgba(243,239,228,.6)}
  .taste{font-family:'Caveat',cursive;font-size:19px;margin:4px 0}
  .taste.y{color:#F5D76E}.taste.p{color:#E8A0A0}
  .price{font-family:'Caveat',cursive;font-size:20px;display:inline-block;border:2px dashed #F3EFE4;
    border-radius:50%;width:74px;height:74px;display:flex;align-items:center;justify-content:center;
    text-align:center;line-height:1;transform:rotate(2deg);margin-top:6px;flex-shrink:0}
  .sortrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
  /* помол */
  .grinds{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .gbtn{font-family:'Caveat',cursive;font-size:16px;background:none;border:1px solid rgba(243,239,228,.4);
    color:#F3EFE4;border-radius:8px;padding:2px 10px;cursor:pointer;transform:rotate(-1deg)}
  .gbtn:nth-child(2n){transform:rotate(1deg)}
  .gbtn.on{background:#F3EFE4;color:#1F2A24}
  .addbtn{font-family:'Caveat',cursive;font-size:18px;background:none;border:1.5px solid #F5D76E;
    color:#F5D76E;border-radius:10px;padding:3px 12px;cursor:pointer;transform:rotate(-1deg)}
  .addbtn:hover{background:#F5D76E;color:#1F2A24}
  .hint{font-size:11px;color:rgba(243,239,228,.45)}
  /* счёт */
  .bill{border-top:1px solid rgba(243,239,228,.3);margin-top:36px;padding-top:18px}
  .bill h2{margin-top:0}
  .billrow{font-family:'Caveat',cursive;font-size:19px;display:flex;justify-content:space-between;
    border-bottom:1px dotted rgba(243,239,228,.25);padding:3px 0;transform:rotate(-.3deg)}
  .billrow .rm{cursor:pointer;color:#E8A0A0;font-size:15px}
  .total{font-family:'Caveat',cursive;font-size:30px;text-align:right;margin:14px 0 4px;
    box-shadow:0 0 0 2px #F3EFE4,0 0 0 5px #1F2A24,0 0 0 7px #F3EFE4;display:inline-block;
    padding:6px 18px;transform:rotate(1.5deg);border-radius:12px;float:right}
  /* форма */
  .formwrap{clear:both;margin-top:26px}
  .fi{display:block;width:100%;max-width:340px;background:none;border:0;border-bottom:1.5px dashed rgba(243,239,228,.5);
    color:#F3EFE4;font-family:'Caveat',cursive;font-size:22px;padding:6px 2px;outline:none;margin:10px 0 4px}
  .fi:focus{border-bottom-color:#F5D76E}
  .fi::placeholder{color:rgba(243,239,228,.4)}
  .cashbtn{font-family:'Caveat',cursive;font-size:24px;background:#F3EFE4;color:#1F2A24;border:0;
    border-radius:10px;padding:6px 24px;cursor:pointer;transform:rotate(-1deg);margin-top:12px}
  .ok{font-family:'Caveat',cursive;font-size:24px;color:#F5D76E;margin-top:12px;display:none;transform:rotate(-.5deg)}
  /* полка */
  .shelf{margin-top:44px;background:linear-gradient(#7a5a3a,#6B4A2F);border-radius:4px;
    padding:16px 14px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    box-shadow:inset 0 -6px 12px rgba(0,0,0,.4),0 10px 20px rgba(0,0,0,.4)}
  @media(max-width:640px){.shelf{grid-template-columns:1fr}}
  .plaque{background:#4a3524;border-radius:6px;padding:12px;color:#F3EFE4;box-shadow:0 4px 8px rgba(0,0,0,.4)}
  .plaque .emo{font-size:30px}
  .plaque h3{font-family:'Caveat',cursive;font-size:22px;margin:2px 0}
  .plaque p{font-size:12px;color:rgba(243,239,228,.7);margin:2px 0 8px}
  .plaque .pp{font-family:'Caveat',cursive;font-size:19px;color:#F5D76E}
  /* ссылка */
  .chalklink{position:absolute;right:14px;top:12px;font-family:'Caveat',cursive;font-size:16px;
    color:rgba(243,239,228,.5);transform:rotate(2deg);text-decoration:none;max-width:150px;text-align:right;line-height:1.1}
  .chalklink:hover{color:#F3EFE4}
  @media(max-width:640px){.chalklink{position:static;display:block;margin:8px 0 0;transform:none;text-align:left;max-width:none}}
</style>
</head>
<body>
<div class="board">
  <a class="chalklink" href="https://kokaomefedron.github.io/NEONFORGE">мел и код —<br>NEONFORGE · kokaomefedron.github.io/NEONFORGE</a>

  <h1>«Свежий помол»</h1>
  <p class="sub">обжариваем по вторникам и пятницам ☕</p>

  <nav>
    <a href="#sorta">Сорта</a><span class="arrow">→</span>
    <a href="#pomol">Помол</a><span class="arrow">→</span>
    <a href="#polka">Полка</a><span class="arrow">→</span>
    <a href="#dostavka">Доставка</a>
  </nav>

  <section id="sorta">
    <h2>Сорта на прилавке:</h2>
    <div class="sorts" id="sorts"></div>
  </section>

  <section id="pomol" class="bill">
    <h2>Счёт мелом:</h2>
    <div id="bill"></div>
    <p class="hint">не выбрали помол — положим зёрна</p>
    <div class="total" id="total">0 ₽</div>
  </section>

  <section id="dostavka" class="formwrap">
    <h2>Записать на кассе:</h2>
    <form id="form">
      <input class="fi" name="name" placeholder="как вас записать?" required>
      <input class="fi" name="phone" placeholder="телефон" required inputmode="tel">
      <button class="cashbtn" type="submit">Записать →</button>
      <p class="ok" id="ok">Заказ принят! Заберёте у прилавка.</p>
    </form>
  </section>

  <section id="polka">
    <h2>Деревянная полка:</h2>
    <div class="shelf" id="shelf"></div>
  </section>
</div>

<script>
const sorts = [
  {id:1,n:'Эфиопия Йиргачеффе',o:'мытая, 1950 м',t:'жасмин, бергамот, лимонная корочка',c:'y',p:1290,cls:'taste y'},
  {id:2,n:'Колумбия Уила',o:'промывная, 1700 м',t:'карамель, красное яблоко',c:'y',p:1090},
  {id:3,n:'Бразилия Сантос',o:'натуральная, 1100 м',t:'фундук, молочный шоколад',c:'p',p:890},
  {id:4,n:'Кения Ньери AA',o:'двойная промывка, 1800 м',t:'чёрная смородина, томатный лист',c:'p',p:1390},
  {id:5,n:'Индонезия Мандэлинг',o:'гилинг-баса, 1400 м',t:'пряности, кедр, чёрный чай',c:'y',p:1190},
  {id:6,n:'Гватемала Антигуа',o:'вулкан, 1600 м',t:'какао, апельсин, дымок',c:'p',p:1150},
];
const grinds = ['в зёрнах','эспрессо','турка','фильтр'];
const picks = {}; // id -> помол
const cart = []; // {id,n,p,g,q}

const sortsEl = document.getElementById('sorts');
sorts.forEach(s=>{
  const d=document.createElement('div'); d.className='sort';
  d.innerHTML=`
    <div class="sortrow">
      <div>
        <h3>${s.n}</h3>
        <div class="origin">${s.o}</div>
        <div class="taste ${s.c}">~ ${s.t} ~</div>
        <div class="grinds" data-g="${s.id}">
          ${grinds.map((g,i)=>`<button class="gbtn${i===0?' on':''}" data-grind="${g}">${g}</button>`).join('')}
        </div>
      </div>
      <div class="price">${s.p}<br>₽/250г</div>
    </div>
    <button class="addbtn" data-add="${s.id}">+ в стакан</button>`;
  sortsEl.appendChild(d);
  picks[s.id]=grinds[0];
});

sortsEl.addEventListener('click',e=>{
  const g=e.target.closest('.gbtn');
  if(g){
    const box=g.parentElement;
    box.querySelectorAll('.gbtn').forEach(b=>b.classList.remove('on'));
    g.classList.add('on'); picks[box.dataset.g]=g.dataset.grind;
    return;
  }
  const a=e.target.closest('.addbtn');
  if(a){
    const id=+a.dataset.add, s=sorts.find(x=>x.id===id), grind=picks[id];
    const key=id+'|'+grind;
    let row=cart.find(c=>c.key===key);
    row?row.q++:cart.push({key,n:s.n+' · '+grind,p:s.p,q:1});
    a.textContent='✓ в стакане'; setTimeout(()=>a.textContent='+ в стакан',900);
    renderBill();
  }
});

function renderBill(){
  const bill=document.getElementById('bill'); bill.innerHTML='';
  cart.forEach(c=>{
    const d=document.createElement('div'); d.className='billrow';
    d.innerHTML=`<span>${c.n}${c.q>1?' × '+c.q:''}</span><span>${(c.p*c.q).toLocaleString('ru')} ₽ <span class="rm" data-rm="${c.key}">стереть</span></span>`;
    bill.appendChild(d);
  });
  if(!cart.length) bill.innerHTML='<div class="billrow"><span>— пока пусто —</span></div>';
  document.getElementById('total').textContent=cart.reduce((s,c)=>s+c.p*c.q,0).toLocaleString('ru')+' ₽';
}
document.getElementById('bill').addEventListener('click',e=>{
  if(e.target.dataset.rm){const i=cart.findIndex(c=>c.key===e.target.dataset.rm);cart.splice(i,1);renderBill();}
});

/* полка аксессуаров */
const acc=[
  {n:'Вешалка-фильтр',e:'🪝',d:'дерево, для воронки Hario',p:1450},
  {n:'Питчер 350 мл',e:'🥛',d:'нерж. сталь, носик-пипетка',p:2100},
  {n:'Весы бариста',e:'⚖️',d:'0.1 г, таймер, USB-C',p:3900},
];
const shelf=document.getElementById('shelf');
acc.forEach(a=>{
  const d=document.createElement('div'); d.className='plaque';
  d.innerHTML=`<span class="emo">${a.e}</span><h3>${a.n}</h3><p>${a.d}</p>
    <div class="sortrow"><span class="pp">${a.p.toLocaleString('ru')} ₽</span>
    <button class="addbtn" data-acc="${a.n}|${a.p}">+ в счёт</button></div>`;
  shelf.appendChild(d);
});
shelf.addEventListener('click',e=>{
  const b=e.target.closest('.addbtn'); if(!b)return;
  const [n,p]=b.dataset.acc.split('|');
  let row=cart.find(c=>c.key===b.dataset.acc);
  row?row.q++:cart.push({key:b.dataset.acc,n,p:+p,q:1});
  renderBill();
});

/* форма */
document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault(); e.target.reset(); cart.length=0; renderBill();
  const ok=document.getElementById('ok'); ok.style.display='block';
  setTimeout(()=>ok.style.display='none',4000);
});
</script>
</body>
</html>
