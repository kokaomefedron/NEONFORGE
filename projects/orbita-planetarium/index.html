<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Орбита — планетарий в Новосибирске</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070716; --viol:#9D6BFF; --blue:#5BC8FF; --txt:#C8CDE8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Inter',sans-serif; font-size:15px; line-height:1.7;
  min-height:100vh; overflow-x:hidden; position:relative;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
::selection{background:var(--viol); color:#fff}

/* звёздный фон — статичные точки box-shadow */
.sky{position:fixed; inset:0; z-index:0; pointer-events:none}
.sky::after{
  content:""; position:absolute; width:2px; height:2px; border-radius:50%; background:#fff;
  top:0; left:0; opacity:.5;
  box-shadow:
    12vw 8vh 0 0 rgba(255,255,255,.55), 25vw 14vh 0 1px rgba(255,255,255,.4),
    40vw 6vh 0 0 rgba(255,255,255,.65), 58vw 11vh 0 1px rgba(255,255,255,.35),
    70vw 18vh 0 0 rgba(255,255,255,.5), 86vw 9vh 0 1px rgba(255,255,255,.45),
    8vw 26vh 0 1px rgba(255,255,255,.3), 33vw 30vh 0 0 rgba(255,255,255,.55),
    52vw 27vh 0 1px rgba(255,255,255,.4), 78vw 33vh 0 0 rgba(255,255,255,.5),
    92vw 28vh 0 1px rgba(255,255,255,.35), 15vw 44vh 0 0 rgba(255,255,255,.45),
    45vw 48vh 0 1px rgba(255,255,255,.3), 66vw 41vh 0 0 rgba(255,255,255,.5),
    88vw 52vh 0 1px rgba(255,255,255,.35), 5vw 62vh 0 0 rgba(255,255,255,.4),
    28vw 66vh 0 1px rgba(255,255,255,.3), 55vw 63vh 0 0 rgba(255,255,255,.45),
    74vw 71vh 0 1px rgba(255,255,255,.3), 95vw 66vh 0 0 rgba(255,255,255,.4),
    18vw 84vh 0 1px rgba(255,255,255,.35), 44vw 88vh 0 0 rgba(255,255,255,.4),
    63vw 82vh 0 1px rgba(255,255,255,.3), 84vw 90vh 0 0 rgba(255,255,255,.45);
}

/* мерцание отдельных звёзд — маленькие div-звёзды */
.tw{position:fixed; width:3px; height:3px; border-radius:50%; background:#fff; z-index:1; animation:tw 3.4s ease-in-out infinite; pointer-events:none}
.tw2{animation-delay:1.2s} .tw3{animation-delay:2.1s; background:var(--blue)} .tw4{animation-delay:.6s; background:var(--viol)}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

/* шапка */
header{
  position:relative; z-index:10; text-align:center; padding:64px 20px 8px;
}
header h1{
  font-size:clamp(34px,6.5vw,58px); font-weight:700; letter-spacing:.35em; color:#fff;
}
header h1 span{color:var(--blue)}
header .sub{font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--viol); margin-top:8px}
header .hint{font-size:12.5px; color:#6a7099; margin-top:20px; max-width:480px; margin-left:auto; margin-right:auto}

/* карта созвездия */
.map-wrap{
  position:relative; z-index:10; max-width:640px; margin:34px auto 0; padding:0 20px;
}
svg.const{width:100%; height:auto; display:block}
svg.const line{stroke:rgba(155,107,255,.35); stroke-width:1; stroke-dasharray:4 5}
svg.const .node{cursor:pointer}
svg.const .node circle.core{
  fill:var(--blue); transition:fill .3s, r .3s; filter:drop-shadow(0 0 8px rgba(91,200,255,.9));
}
svg.const .node text{
  font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:2px;
  fill:#7d84ad; text-transform:uppercase; transition:fill .3s; text-anchor:middle;
}
svg.const .node:hover circle.core{fill:#fff}
svg.const .node.on circle.core{fill:var(--viol); filter:drop-shadow(0 0 16px rgba(157,107,255,1))}
svg.const .node.on text{fill:#fff}

/* мини-карта */
.mini{
  position:fixed; top:16px; right:16px; z-index:30; width:120px; opacity:.85;
  background:rgba(7,7,22,.7); border:1px solid rgba(157,107,255,.3); border-radius:10px;
  padding:8px 6px 4px; backdrop-filter:blur(4px);
}
.mini p{font-size:8px; letter-spacing:2px; color:#6a7099; text-align:center; text-transform:uppercase; margin-bottom:2px}
.mini svg{width:100%; display:block}
.mini line{stroke:rgba(157,107,255,.3); stroke-width:.6}
.mini circle{fill:#3a4066}
.mini circle.on{fill:var(--viol)}
@media(max-width:700px){.mini{width:84px}}

/* панель контента */
.panel{
  position:relative; z-index:10; max-width:680px; margin:40px auto 0;
  background:rgba(10,10,30,.85); border:1px solid rgba(157,107,255,.35); border-radius:14px;
  padding:38px 40px 34px; backdrop-filter:blur(6px);
  min-height:220px;
}
@media(max-width:700px){.panel{margin:26px 14px 0; padding:26px 20px}}
.panel h2{font-size:26px; color:#fff; margin-bottom:4px}
.panel .pcode{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--blue); margin-bottom:20px}
.panel .fade{animation:pf .4s ease}
@keyframes pf{from{opacity:0; transform:translateY(10px)}to{opacity:1}}

/* сеансы */
.show{list-style:none}
.show li{
  display:flex; gap:14px; align-items:baseline; padding:11px 10px; font-size:15px;
  border-bottom:1px solid rgba(157,107,255,.14); transition:background .2s;
}
.show li:hover{background:rgba(157,107,255,.1)}
.show .d{font-family:'Space Grotesk',sans-serif; color:var(--blue); white-space:nowrap; font-size:14px}
.show .t{color:#6a7099; font-size:13px; white-space:nowrap}
.show .n{flex:1; color:#e6e9f8}
.show .p{font-weight:600; color:#fff; white-space:nowrap}

/* купол: характеристики */
.specs{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:18px}
.specs div{border:1px solid rgba(157,107,255,.25); border-radius:10px; padding:14px 12px; text-align:center}
.specs b{display:block; font-family:'Space Grotesk',sans-serif; font-size:20px; color:var(--blue)}
.specs span{font-size:11px; letter-spacing:1px; color:#6a7099; text-transform:uppercase}
@media(max-width:700px){.specs{grid-template-columns:1fr 1fr}}

/* билеты: форма */
.form{margin-top:6px}
.form label{display:block; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#7d84ad; margin:16px 0 5px}
.form select,.form input{
  width:100%; background:rgba(7,7,22,.8); border:1px solid rgba(157,107,255,.35);
  border-radius:8px; color:#e6e9f8; padding:10px 12px; font-family:'Inter',sans-serif; font-size:15px;
  outline:none; transition:border .2s;
}
.form select:focus,.form input:focus{border-color:var(--blue)}
.form button{
  margin-top:22px; background:linear-gradient(90deg,var(--viol),var(--blue)); border:none;
  color:#070716; font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:2px;
  padding:13px 28px; border-radius:8px; cursor:pointer; font-size:14px; text-transform:uppercase;
}
.form button:hover{filter:brightness(1.15)}
.form .ok{margin-top:12px; font-size:13px; color:var(--blue)}

/* дети/о нас тексты */
.p-note{font-size:15px; color:#aab0d0}
.p-note b{color:#fff}

/* ссылка на студию — самый мелкий угол */
.made{
  position:fixed; bottom:8px; left:10px; z-index:30;
  font-size:9px; letter-spacing:1px; color:#3c4166;
}
.made a{color:#4a5080; text-decoration:none; border-bottom:1px dotted #3c4166}
.made a:hover{color:var(--viol)}
footer.sp{height:70px}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<span class="tw" style="top:12%; left:20%"></span>
<span class="tw tw2" style="top:36%; left:70%"></span>
<span class="tw tw3" style="top:60%; left:12%"></span>
<span class="tw tw4" style="top:78%; left:85%"></span>

<header>
  <h1>ОРБИТ<span>A</span></h1>
  <p class="sub">планетарий · новосибирск · ул. Дуси Ковальчук, 40</p>
  <p class="hint">Навигация по созвездию: каждая звезда — раздел. Нажмите на светящуюся точку.</p>
</header>

<div class="map-wrap">
  <svg class="const" viewBox="0 0 640 260" aria-label="созвездие навигации">
    <line x1="110" y1="70"  x2="240" y2="150"/>
    <line x1="240" y1="150" x2="380" y2="60"/>
    <line x1="380" y1="60"  x2="500" y2="140"/>
    <line x1="240" y1="150" x2="300" y2="225"/>
    <line x1="300" y1="225" x2="500" y2="140"/>

    <g class="node on" data-id="aff"><circle class="core" cx="110" cy="70"  r="9"/><circle cx="110" cy="70" r="20" fill="none" stroke="rgba(91,200,255,.25)"/><text x="110" y="42">Афиша</text></g>
    <g class="node" data-id="dom"><circle class="core" cx="240" cy="150" r="9"/><text x="240" y="184">Купол</text></g>
    <g class="node" data-id="kid"><circle class="core" cx="380" cy="60"  r="9"/><text x="380" y="34">Детям</text></g>
    <g class="node" data-id="tix"><circle class="core" cx="500" cy="140" r="9"/><text x="500" y="174">Билеты</text></g>
    <g class="node" data-id="about"><circle class="core" cx="300" cy="225" r="9"/><text x="300" y="252">О нас</text></g>
  </svg>
</div>

<!-- мини-карта -->
<aside class="mini" aria-hidden="true">
  <p>Созвездие</p>
  <svg viewBox="0 0 640 260">
    <line x1="110" y1="70" x2="240" y2="150"/><line x1="240" y1="150" x2="380" y2="60"/>
    <line x1="380" y1="60" x2="500" y2="140"/><line x1="240" y1="150" x2="300" y2="225"/>
    <line x1="300" y1="225" x2="500" y2="140"/>
    <circle id="m-aff"   class="on" cx="110" cy="70"  r="16"/>
    <circle id="m-dom"   cx="240" cy="150" r="16"/>
    <circle id="m-kid"   cx="380" cy="60"  r="16"/>
    <circle id="m-tix"   cx="500" cy="140" r="16"/>
    <circle id="m-about" cx="300" cy="225" r="16"/>
  </svg>
</aside>

<section class="panel" id="panel"></section>
<footer class="sp"></footer>

<p class="made">orbit: <a href="https://kokaomefedron.github.io/NEONFORGE" target="_blank" rel="noopener">NEONFORGE — kokaomefedron.github.io/NEONFORGE</a></p>

<script>
(function(){
  var P=document.getElementById('panel');
  var nodes=document.querySelectorAll('svg.const .node');
  var contents={
    aff:{t:'Афиша', c:'SEKTOR 01 · SHOWS', h:''},
    dom:{t:'Купол', c:'SEKTOR 02 · THE DOME'},
    kid:{t:'Детям', c:'SEKTOR 03 · YOUNG STARS'},
    tix:{t:'Билеты', c:'SEKTOR 04 · TICKETS'},
    about:{t:'О нас', c:'SEKTOR 05 · CREW'}
  };
  var html={
    aff:'<ul class="show">'+
      '<li><span class="d">14.11 · пт</span><span class="n">«Тайны Чёрных дыр»</span><span class="t">19:00</span><span class="p">600 ₽</span></li>'+
      '<li><span class="d">15.11 · сб</span><span class="n">«Зимнее небо Сибири»</span><span class="t">12:00 · 17:00</span><span class="p">500 ₽</span></li>'+
      '<li><span class="d">15.11 · сб</span><span class="n">Пинк-Флойд: Dark Side под куполом</span><span class="t">21:00</span><span class="p">900 ₽</span></li>'+
      '<li><span class="d">16.11 · вс</span><span class="n">«Марс. Красный сосед»</span><span class="t">14:00</span><span class="p">550 ₽</span></li>'+
      '<li><span class="d">21.11 · пт</span><span class="n">Ночная сессия: метеорный поток Леониды</span><span class="t">23:30</span><span class="p">1 100 ₽</span></li>'+
      '</ul><p class="p-note" style="margin-top:14px">Сеансы длятся 50 минут. Опоздавших не пересаживаем на другой сеанс — купите билет на ближайший следующий.</p>',
    dom:'<p class="p-note">Наш купол — <b>12 метров в диаметре</b>, 108 мест в креслах с откидными спинками '+
      'и 4K-проекторы, дающие 8К-картинку после сшивки. Звук — 7.1, но громкость держим вежливой: '+
      'титанические аккорды не должны пугать школьные экскурсии.</p>'+
      '<div class="specs">'+
      '<div><b>12 м</b><span>диаметр купола</span></div>'+
      '<div><b>4K × 6</b><span>проекторов</span></div>'+
      '<div><b>108</b><span>мест в зале</span></div></div>',
    kid:'<p class="p-note">Сеансы для юных астронавтов от 4 лет: коротко, громко, весело. '+
      '<b>«Малышам о звёздах»</b> — 30 минут, кукла Незнайка и никакого латыни. '+
      '<b>«Космос своими руками»</b> — мастерская по субботам в 10:00, дети собирают '+
      'бумажные планетары, родители пьют кофе в холле. Цена детского билета — 350 ₽, '+
      'сопровождающие — бесплатно.</p>',
    tix:'<form class="form" id="tixForm">'+
      '<label>Сеанс</label><select id="fShow"><option>14.11 · «Тайны Чёрных дыр» · 19:00</option>'+
      '<option>15.11 · «Зимнее небо Сибири» · 12:00</option><option>15.11 · Pink Floyd под куполом · 21:00</option>'+
      '<option>16.11 · «Марс. Красный сосед» · 14:00</option><option>21.11 · Ночная сессия Леониды · 23:30</option></select>'+
      '<label>Билетов</label><input id="fQty" type="number" min="1" max="10" value="2">'+
      '<label>Имя для брони</label><input id="fName" type="text" required>'+
      '<button type="submit">Забронировать</button><p class="ok" id="tixOk"></p></form>'+
      '<p class="p-note" style="margin-top:12px">Оплата при входе. Бронь держим 20 минут до сеанса.</p>',
    about:'<p class="p-note">Новосибирский «Орбита» открылся в 2019-м в бывшем ДК завода «Сибсельмаш». '+
      'Команда — восемь человек: два астронома, три лектора, инженер проекционной техники '+
      'и два администратора, которые помнят постоянных гостей по именам. Раз в месяц по пятницам — '+
      '<b>открытый лекторий</b>: приходите с вопросами, уходите с новым небом.</p>'
  };
  function activate(id){
    nodes.forEach(function(n){n.classList.toggle('on', n.dataset.id===id)});
    document.querySelectorAll('.mini circle').forEach(function(c){
      c.classList.toggle('on', c.id==='m-'+id);
    });
    var c=contents[id];
    P.innerHTML='<h2>'+c.t+'</h2><p class="pcode">'+c.c+'</p><div class="fade">'+html[id]+'</div>';
    P.classList.remove('fade'); void P.offsetWidth; P.classList.add('fade');
    P.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  nodes.forEach(function(n){
    n.addEventListener('click',function(){activate(n.dataset.id)});
  });
  activate('aff');
  document.addEventListener('click',function(e){
    var f=document.getElementById('tixForm');
    if(f && !f.dataset.bound){f.dataset.bound=1;
      f.addEventListener('submit',function(ev){
        ev.preventDefault();
        document.getElementById('tixOk').textContent='Бронь принята, '+document.getElementById('fName').value+'. Ждём вас под куполом.';
        f.reset();
      });
    }
  });
})();
</script>
</body>
</html>
