<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>НЕОН-РАННЕР — аркадный автомат</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0a0a0c;
    background-image:radial-gradient(ellipse at 50% -10%, #16161d 0%, #0a0a0c 60%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Exo 2', sans-serif; color:#dfe6ea;
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  /* ==== КОРПУС АВТОМАТА ==== */
  .cabinet {
    position:relative;
    width:min(560px, 96vw);
    display:flex; align-items:stretch;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.7));
  }
  .side {
    width:56px; flex:none;
    border-radius:14px 0 0 14px;
    background:linear-gradient(90deg,#241f3a 0%, #3a2f66 40%, #241f3a 100%);
    position:relative; overflow:hidden;
    border:2px solid #4d3f8a; border-right:none;
  }
  .side.right { border-radius:0 14px 14px 0; border-left:none; border-right:2px solid #4d3f8a; }
  .side-sticker {
    position:absolute; inset:10px;
    background:linear-gradient(180deg,#FF3131 0%, #FF3131 45%, #00C2FF 100%);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 18px rgba(0,0,0,.45);
  }
  .side-sticker span {
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-family:'Press Start 2P', monospace;
    font-size:9px; letter-spacing:2px; color:#0a0a0c;
    line-height:1.7; text-align:center;
  }
  .side-sticker a {
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-family:'Press Start 2P', monospace;
    font-size:7px; color:#0a0a0c; text-decoration:underline;
    margin-top:12px;
  }
  .top-sign {
    position:absolute; top:-58px; left:50%; transform:translateX(-50%);
    width:88%; height:52px;
    background:linear-gradient(180deg,#1b1430,#0e0a1a);
    border:2px solid #4d3f8a; border-radius:26px 26px 6px 6px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 24px rgba(57,255,20,.18);
    z-index:2;
  }
  .top-sign b {
    font-family:'Press Start 2P', monospace; font-size:15px;
    color:#39FF14;
    text-shadow:0 0 10px rgba(57,255,20,.9), 3px 3px 0 #00C2FF, -3px -3px 0 #FF3131;
    letter-spacing:2px;
  }
  .body-main {
    flex:1; min-width:0;
    background:linear-gradient(180deg,#20222b,#15161c);
    border:2px solid #3a3d4a;
    border-radius:0 0 18px 18px;
    padding:14px 12px 18px;
    display:flex; flex-direction:column; gap:12px;
  }
  .marquee-strip {
    height:10px; border-radius:5px;
    background:repeating-linear-gradient(90deg,#39FF14 0 14px,#00C2FF 14px 28px,#FF3131 28px 42px);
    opacity:.85; flex:none;
  }
  /* ==== ЭКРАН ==== */
  .screen-bezel {
    border-radius:18px;
    background:linear-gradient(180deg,#33353f,#1c1d24);
    border:2px solid #4a4d5c;
    padding:10px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.6);
    flex:none;
  }
  .screen {
    position:relative; border-radius:12px; overflow:hidden;
    background:#020403;
  }
  #game { display:block; width:100%; height:auto; }
  .screen::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,.07) 0%, transparent 30%, transparent 70%, rgba(255,255,255,.05) 100%);
  }
  /* ==== ПАНЕЛЬ УПРАВЛЕНИЯ ==== */
  .panel {
    flex:none;
    background:linear-gradient(180deg,#2a2c36,#1a1b22);
    border:2px solid #3a3d4a; border-radius:14px;
    padding:14px;
    display:flex; align-items:center; gap:16px;
  }
  .btn-start {
    width:74px; height:74px; border-radius:50%;
    flex:none; cursor:pointer;
    background:radial-gradient(circle at 34% 30%, #ff6a6a, #FF3131 55%, #a80f0f 100%);
    border:3px solid #7d1010;
    box-shadow:0 5px 0 #5c0a0a, inset 0 -6px 12px rgba(0,0,0,.35);
    font-family:'Press Start 2P', monospace; font-size:8px; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
    transition:transform .08s, box-shadow .08s;
  }
  .btn-start:active { transform:translateY(4px); box-shadow:0 1px 0 #5c0a0a; }
  .joystick {
    width:74px; height:74px; flex:none;
    background:radial-gradient(circle,#23252e,#171820);
    border:2px solid #3a3d4a; border-radius:12px;
    position:relative;
  }
  .stick-base {
    position:absolute; left:50%; top:50%; width:38px; height:38px;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 45deg,#39FF14 0 90deg,#00C2FF 90deg 180deg,#FF3131 180deg 270deg,#e6c211 270deg 360deg);
    border-radius:50%;
    box-shadow:0 0 12px rgba(57,255,20,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .stick-base::before {
    content:""; width:14px; height:14px; border-radius:50%;
    background:#0c0d12; box-shadow:inset 0 0 4px #000;
  }
  .stick-cap {
    position:absolute; left:50%; top:38%; width:16px; height:16px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 35% 30%,#8d94a8,#3a3d4a);
    border-radius:50%;
  }
  .coin-slot {
    margin-left:auto; text-align:center;
  }
  .coin-door {
    width:64px; height:44px;
    background:#0b0c10; border:2px solid #3a3d4a; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 10px #000;
  }
  .coin-glow {
    width:30px; height:5px; border-radius:3px;
    background:#39FF14; box-shadow:0 0 8px #39FF14;
    animation:coinblink 1.1s steps(2) infinite;
  }
  @keyframes coinblink { 50% { opacity:.15; box-shadow:none; } }
  .coin-label {
    margin-top:6px;
    font-family:'Press Start 2P', monospace; font-size:7px;
    color:#e6c211; letter-spacing:1px;
  }
  .hint {
    font-family:'Press Start 2P', monospace; font-size:7px;
    color:#6b7280; text-align:center; line-height:1.8;
  }
  /* мобильная кнопка прыжка */
  .btn-jump {
    display:none;
    margin:0 auto; width:100%; max-width:280px;
    padding:16px 0; border-radius:12px;
    background:#FF3131; border:none; color:#fff;
    font-family:'Press Start 2P', monospace; font-size:10px;
    box-shadow:0 4px 0 #7d1010; cursor:pointer;
    min-height:56px;
  }
  @media (max-width:560px) {
    .cabinet { flex-direction:column; width:96vw; }
    .side { width:auto; height:34px; border-radius:14px 14px 0 0; }
    .side.right { height:10px; }
    .side-sticker { inset:4px 10px; }
    .side-sticker span, .side-sticker a {
      writing-mode:horizontal-tb; transform:none; font-size:7px;
    }
    .top-sign { top:-46px; height:40px; }
    .top-sign b { font-size:11px; }
    .joystick { display:none; }
    .coin-slot { display:none; }
    .btn-jump { display:block; }
    .panel { padding:10px; justify-content:center; }
  }
</style>
</head>
<body>
<div class="cabinet">
  <div class="side">
    <div class="side-sticker">
      <span>НЕОН-РАННЕР · АВТОМАТ ОТ NEONFORGE · <a href="https://kokaomefedron.github.io/NEONFORGE" target="_blank" rel="noopener">kokaomefedron.github.io/NEONFORGE</a></span>
    </div>
  </div>
  <div class="body-main">
    <div class="marquee-strip"></div>
    <div class="top-sign"><b>НЕОН-РАННЕР</b></div>
    <div class="screen-bezel">
      <div class="screen"><canvas id="game"></canvas></div>
    </div>
    <div class="panel">
      <button class="btn-start" id="btnStart" type="button">СТАРТ</button>
      <div class="joystick" aria-hidden="true">
        <div class="stick-base"></div>
        <div class="stick-cap"></div>
      </div>
      <div class="coin-slot">
        <div class="coin-door"><div class="coin-glow"></div></div>
        <div class="coin-label">ВСТАВЬТЕ ЖЕТОН</div>
      </div>
    </div>
    <button class="btn-jump" id="btnJump" type="button">ПРЫЖОК ▲</button>
    <div class="hint">ПРОБЕЛ / ТАП = ПРЫЖОК · ДВОЙНОЙ РАЗРЕШЁН</div>
  </div>
  <div class="side right">
    <div class="side-sticker"><span style="opacity:.0">.</span></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('game'), ctx = cv.getContext('2d');
  var W = 480, H = 300;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit(){
    var w = cv.clientWidth || W;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit(); window.addEventListener('resize', fit);

  var NEON='#39FF14', RED='#FF3131', BLUE='#00C2FF', YEL='#e6c211';
  var S = { idle:0, run:1, dead:2 };
  var st = S.idle, speed = 240, dist = 0, score = 0, best = 0, t = 0;
  try { best = parseInt(localStorage.getItem('nf_runner')||'0',10)||0; } catch(e){}

  var groundY = H - 52;
  var hero = { x:70, y:groundY, vy:0, w:26, h:34, jumps:0, blink:0 };
  var GRAV = 1500, JUMP_V = 560, JUMP2_V = 480;
  var obs = [], nextSpawn = 0.9;
  var clouds = [], stars = [];
  for (var i=0;i<7;i++) clouds.push({ x:Math.random()*W, y:20+Math.random()*70, s:.5+Math.random()*.8 });
  for (var j=0;j<26;j++) stars.push({ x:Math.random()*W, y:Math.random()*groundY-20, r:Math.random()*1.4+.4, p:Math.random()*6 });

  function reset(){
    st = S.run; speed = 240; dist = 0; score = 0; t = 0;
    hero.y = groundY; hero.vy = 0; hero.jumps = 0;
    obs.length = 0; nextSpawn = 0.9;
  }

  function jump(){
    if (st === S.idle){ reset(); return; }
    if (st === S.dead){ reset(); return; }
    if (hero.jumps === 0 && hero.y >= groundY - .5){
      hero.vy = -JUMP_V; hero.jumps = 1;
    } else if (hero.jumps === 1){
      hero.vy = -JUMP2_V; hero.jumps = 2;
    }
  }

  document.getElementById('btnStart').addEventListener('click', function(){ reset(); });
  document.getElementById('btnJump').addEventListener('click', function(e){ e.preventDefault(); jump(); });
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); jump(); });
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); }
  });

  function spawn(){
    var r = Math.random();
    if (r < .45){
      obs.push({ type:'spike', x:W+20, w:18, h:26 });
    } else if (r < .8){
      obs.push({ type:'block', x:W+20, w:34, h:20+Math.random()*18 });
    } else {
      obs.push({ type:'tall', x:W+20, w:18, h:44 });
    }
    nextSpawn = .75 + Math.random()*.9 - Math.min(.4, speed/900);
  }

  function update(dt){
    t += dt;
    if (st !== S.run) return;
    speed = Math.min(620, 240 + dist*0.012);
    dist += speed*dt; score = Math.floor(dist/10);
    for (var i=0;i<clouds.length;i++){
      clouds[i].x -= speed*.18*dt*clouds[i].s;
      if (clouds[i].x < -60){ clouds[i].x = W+40; clouds[i].y = 20+Math.random()*70; }
    }
    // физика героя
    hero.vy += GRAV*dt; hero.y += hero.vy*dt;
    if (hero.y >= groundY){ hero.y = groundY; hero.vy = 0; hero.jumps = 0; }
    // препятствия
    nextSpawn -= dt;
    if (nextSpawn <= 0) spawn();
    for (var k=obs.length-1;k>=0;k--){
      var o = obs[k]; o.x -= speed*dt;
      if (o.x + o.w < -10) obs.splice(k,1);
      else if (hero.x+hero.w-4 > o.x && hero.x+4 < o.x+o.w && hero.y > groundY - o.h){
        st = S.dead;
        if (score > best){ best = score; try{ localStorage.setItem('nf_runner', String(best)); }catch(e){} }
      }
    }
  }

  function px(n){ return n|0; }
  function draw(){
    // фон
    ctx.fillStyle = '#020403'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = .7; ctx.fillStyle = BLUE;
    for (var s=0;s<stars.length;s++){
      var stx = (stars[s].x - t*8*stars[s].p) % W; if (stx<0) stx+=W;
      var tw = .5 + .5*Math.sin(t*3+stars[s].p);
      ctx.globalAlpha = .25 + .45*tw*.7;
      ctx.fillRect(px(stx), px(stars[s].y), 2, 2);
    }
    ctx.globalAlpha = .12; ctx.fillStyle = NEON;
    for (var c=0;c<clouds.length;c++){
      ctx.beginPath(); ctx.ellipse(clouds[c].x, clouds[c].y, 34*clouds[c].s, 9*clouds[c].s, 0, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // земля — неоновая линия + сетка
    ctx.strokeStyle = NEON; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY+1); ctx.lineTo(W, groundY+1); ctx.stroke();
    ctx.strokeStyle = 'rgba(57,255,20,.25)'; ctx.lineWidth = 1;
    for (var g=0; g<12; g++){
      var gx = (g*48 - (dist)%48);
      ctx.beginPath(); ctx.moveTo(gx, groundY+4); ctx.lineTo(gx-14, H); ctx.stroke();
    }
    // герой
    var hx = px(hero.x), hy = px(hero.y - hero.h);
    ctx.fillStyle = '#0d1608';
    ctx.fillRect(hx, hy, hero.w, hero.h);
    ctx.strokeStyle = NEON; ctx.lineWidth = 2; ctx.strokeRect(hx, hy, hero.w, hero.h);
    ctx.fillStyle = RED;
    var bl = (Math.sin(t*2) > .93) ? 1 : 0;
    if (!bl){ ctx.fillRect(hx+6, hy+8, 4, 4); ctx.fillRect(hx+16, hy+8, 4, 4); }
    ctx.strokeStyle = BLUE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx-6, hero.y); ctx.lineTo(hx-6, hy+10+Math.sin(t*18)*3); ctx.stroke();
    // препятствия
    for (var o=0;o<obs.length;o++){
      var b = obs[o], bx = px(b.x), by = px(groundY - b.h);
      ctx.fillStyle = '#160404';
      ctx.fillRect(bx, by, b.w, b.h);
      ctx.strokeStyle = RED; ctx.lineWidth = 2; ctx.strokeRect(bx, by, b.w, b.h);
      if (b.type === 'spike'){
        ctx.beginPath(); ctx.moveTo(bx+b.w/2, by); ctx.lineTo(bx+b.w, by+b.h); ctx.lineTo(bx, by+b.h);
        ctx.strokeStyle = RED; ctx.stroke();
      }
    }
    // HUD
    ctx.font = "10px 'Press Start 2P', monospace";
    ctx.fillStyle = NEON; ctx.textAlign = 'left';
    ctx.fillText('СЧЁТ ' + String(score).padStart(5,'0'), 14, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = YEL;
    ctx.fillText('РЕКОРД ' + String(best).padStart(5,'0'), W-14, 24);

    if (st === S.idle){
      ctx.textAlign = 'center';
      ctx.fillStyle = BLUE; ctx.font = "9px 'Press Start 2P', monospace";
      if (Math.sin(t*4) > -0.2) ctx.fillText('НАЖМИ СТАРТ / ТАП', W/2, H/2 - 20);
    }
    if (st === S.dead){
      ctx.fillStyle = 'rgba(2,4,3,.72)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.fillStyle = RED; ctx.font = "16px 'Press Start 2P', monospace";
      ctx.fillText('GAME OVER', W/2, H/2 - 26);
      ctx.fillStyle = NEON; ctx.font = "9px 'Press Start 2P', monospace";
      ctx.fillText('СЧЁТ: ' + score, W/2, H/2 + 2);
      ctx.fillStyle = YEL;
      ctx.fillText('РЕКОРД: ' + best, W/2, H/2 + 22);
      if (Math.sin(t*5) > 0){
        ctx.fillStyle = '#fff';
        ctx.fillText('ТАП = СНОВА', W/2, H/2 + 48);
      }
    }
  }

  var last = performance.now(), hidden = false;
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ hidden = true; last = performance.now(); }
    else { hidden = false; last = performance.now(); }
  });
  function loop(now){
    requestAnimationFrame(loop);
    if (hidden) return;
    var dt = Math.min(.05, (now - last)/1000); last = now;
    if (st !== S.dead) update(dt); else t += dt;
    draw();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
