<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Метрика LIVE — дашборд</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'IBM Plex Sans',sans-serif;background:#F6F8FB;color:#1B2333;overflow-x:hidden}
  .num{font-variant-numeric:tabular-nums}
  .blob{position:fixed;filter:blur(90px);opacity:.5;border-radius:9999px;pointer-events:none;z-index:-1}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(27,35,51,.06)}
  .per-btn{min-height:40px;transition:all .2s}
  .per-btn.on{background:#1B2333;color:#fff}
  .per-btn:not(.on):hover{background:rgba(255,255,255,.8)}
  .kpi{transition:transform .2s}
  .kpi:hover{transform:translateY(-2px)}
  .up{color:#0E9F6E}.down{color:#E02424}
  @keyframes rowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .feed-row{animation:rowIn .4s ease}
  .feed-dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0}
  .goal-bar{height:8px;border-radius:9999px;background:rgba(27,35,51,.08);overflow:hidden}
  .goal-fill{height:100%;border-radius:9999px;transition:width .8s ease;
    background:linear-gradient(90deg,#6366F1,#22D3EE)}
  .paused-badge{display:none}
  body.paused .paused-badge{display:inline-flex}
  body.paused #live-dot{background:#F59E0B}
  canvas{display:block;width:100%}
</style>
</head>
<body class="min-h-screen">
<div class="blob" style="width:420px;height:420px;background:#6366F1;top:-120px;left:-100px"></div>
<div class="blob" style="width:380px;height:380px;background:#22D3EE;top:20%;right:-140px"></div>
<div class="blob" style="width:340px;height:340px;background:#F97316;bottom:-100px;left:30%"></div>

<div class="max-w-6xl mx-auto px-4 py-8 md:py-12">
  <header class="flex flex-wrap items-end justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Метрика <span style="color:#6366F1">LIVE</span></h1>
      <p class="text-sm mt-1" style="color:#5B6474">Состояние магазина — обновляется в реальном времени</p>
    </div>
    <div class="glass rounded-full px-4 py-2 text-xs font-semibold flex items-center gap-2">
      <span id="live-dot" class="w-2.5 h-2.5 rounded-full bg-green-500" style="box-shadow:0 0 0 0 rgba(16,185,129,.6)"></span>
      <span id="live-time" class="num">—</span>
      <span class="paused-badge items-center gap-1 px-2 py-0.5 rounded-full" style="background:rgba(245,158,11,.15);color:#B45309">
        ⏸ пауза — вкладка скрыта
      </span>
    </div>
  </header>

  <!-- KPI -->
  <section id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6"></section>

  <!-- Графики -->
  <section class="grid lg:grid-cols-[1fr_320px] gap-4 mb-6">
    <div class="glass rounded-2xl p-4 md:p-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="font-bold text-lg">Выручка</h2>
        <div class="flex gap-1 glass rounded-full p-1">
          <button class="per-btn on rounded-full px-4 text-xs font-semibold" data-p="7">7д</button>
          <button class="per-btn rounded-full px-4 text-xs font-semibold" data-p="30">30д</button>
          <button class="per-btn rounded-full px-4 text-xs font-semibold" data-p="90">90д</button>
        </div>
      </div>
      <canvas id="rev-chart" height="240"></canvas>
      <div class="flex justify-between text-xs mt-2 num" style="color:#5B6474"><span id="rev-min"></span><span id="rev-max"></span></div>
    </div>
    <div class="glass rounded-2xl p-4 md:p-6">
      <h2 class="font-bold text-lg mb-4">Каналы</h2>
      <canvas id="donut" height="200"></canvas>
      <div id="donut-legend" class="mt-4 space-y-2 text-sm"></div>
    </div>
  </section>

  <!-- Цель месяца -->
  <section class="glass rounded-2xl p-4 md:p-6 mb-6">
    <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
      <h2 class="font-bold text-lg">Цель месяца</h2>
      <span class="text-xs num" style="color:#5B6474">план 1 200 000 ₽ · осталось <b id="goal-days" class="num">—</b> дн.</span>
    </div>
    <div class="goal-bar"><div class="goal-fill" id="goal-fill" style="width:0%"></div></div>
    <div class="flex justify-between text-xs mt-2 num" style="color:#5B6474">
      <span id="goal-now">—</span><span>1 200 000 ₽</span>
    </div>
  </section>

  <!-- Лента + таблица -->
  <section class="grid lg:grid-cols-2 gap-4">
    <div class="glass rounded-2xl p-4 md:p-6">
      <h2 class="font-bold text-lg mb-3 flex items-center gap-2">
        Живая лента
        <span class="w-2 h-2 rounded-full bg-orange-400" style="animation:pulse 1.6s infinite"></span>
      </h2>
      <div id="feed" class="space-y-1"></div>
    </div>
    <div class="glass rounded-2xl p-4 md:p-6">
      <h2 class="font-bold text-lg mb-3">Топ страниц</h2>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs" style="color:#5B6474"><th class="pb-2">Страница</th><th class="pb-2 text-right">Визиты</th><th class="pb-2 text-right">CR</th></tr></thead>
        <tbody id="pages"></tbody>
      </table>
    </div>
  </section>

  <footer class="mt-10 text-center text-xs" style="color:#8A93A6">
    панель от NEONFORGE — <a class="underline" href="https://kokaomefedron.github.io/NEONFORGE">kokaomefedron.github.io/NEONFORGE</a>
  </footer>
</div>

<script>
'use strict';
const DPR=Math.min(window.devicePixelRatio||1,2);

/* --- KPI --- */
const KPI=[
  {label:'Визиты', base:12480, fmt:v=>Math.round(v).toLocaleString('ru-RU'), d:3.2},
  {label:'Конверсия', base:3.4, fmt:v=>v.toFixed(1)+' %', d:-0.6},
  {label:'Средний чек', base:7900, fmt:v=>Math.round(v).toLocaleString('ru-RU')+' ₽', d:1.8},
  {label:'Выручка', base:987000, fmt:v=>Math.round(v).toLocaleString('ru-RU')+' ₽', d:5.4}
];
const kpiState=KPI.map(()=>({cur:0}));
function renderKpis(dt){
  const el=document.getElementById('kpis');
  if(!el.children.length){
    el.innerHTML=KPI.map(k=>`
      <div class="kpi glass rounded-2xl p-4">
        <div class="text-xs font-medium" style="color:#5B6474">${k.label}</div>
        <div class="text-xl md:text-2xl font-bold num mt-1" data-v>—</div>
        <div class="text-xs font-semibold mt-1 num" data-d></div>
      </div>`).join('');
  }
  [...el.children].forEach((card,i)=>{
    const target=KPI[i].base*(1+Math.sin(performance.now()/9000+i)*0.015);
    kpiState[i].cur+=(target-kpiState[i].cur)*Math.min(1,dt*3);
    card.querySelector('[data-v]').textContent=KPI[i].fmt(kpiState[i].cur);
    const d=KPI[i].d, de=card.querySelector('[data-d]');
    de.textContent=(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+' %';
    de.className='text-xs font-semibold mt-1 num '+(d>=0?'up':'down');
  });
}

/* --- График выручки --- */
const revChart=document.getElementById('rev-chart');
let period=7, revData=[], revProg=0;
function genData(n){
  let v=70000, arr=[];
  for(let i=0;i<n;i++){v+= (Math.sin(i*1.7)*0.25+Math.random()-0.45)*14000; v=Math.max(28000,v); arr.push(v);}
  return arr;
}
function setPeriod(p){
  period=p; revData=genData(p); revProg=0;
  document.querySelectorAll('.per-btn').forEach(b=>b.classList.toggle('on',+b.dataset.p===p));
}
document.querySelectorAll('.per-btn').forEach(b=>b.addEventListener('click',()=>setPeriod(+b.dataset.p)));

function sizeCanvas(c){
  const r=c.getBoundingClientRect();
  c.width=Math.round(r.width*DPR); c.height=Math.round(+c.getAttribute('height')*DPR);
  c.style.height=c.getAttribute('height')+'px';
}
function drawRev(){
  const ctx=revChart.getContext('2d'), W=revChart.width, H=revChart.height;
  ctx.clearRect(0,0,W,H);
  if(!revData.length) return;
  revProg=Math.min(1,revProg+0.02);
  const min=Math.min(...revData), max=Math.max(...revData), pad=20*DPR;
  const X=i=>pad+i*(W-pad*2)/(revData.length-1), Y=v=>H-pad-(v-min)/(max-min)*(H-pad*2.4);
  ctx.strokeStyle='rgba(27,35,51,.07)';ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const y=pad+g*(H-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
  const n=Math.max(2,Math.floor(revData.length*revProg));
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(99,102,241,.30)');grad.addColorStop(1,'rgba(99,102,241,0)');
  ctx.beginPath();ctx.moveTo(X(0),Y(revData[0]));
  for(let i=1;i<n;i++)ctx.lineTo(X(i),Y(revData[i]));
  ctx.strokeStyle='#6366F1';ctx.lineWidth=2.5*DPR;ctx.lineJoin='round';ctx.stroke();
  ctx.lineTo(X(n-1),H-pad);ctx.lineTo(X(0),H-pad);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  const lx=X(n-1),ly=Y(revData[n-1]);
  ctx.beginPath();ctx.arc(lx,ly,4*DPR,0,7);ctx.fillStyle='#6366F1';ctx.fill();
  ctx.beginPath();ctx.arc(lx,ly,7*DPR,0,7);ctx.strokeStyle='rgba(99,102,241,.35)';ctx.lineWidth=2*DPR;ctx.stroke();
  document.getElementById('rev-min').textContent=Math.round(min).toLocaleString('ru-RU')+' ₽';
  document.getElementById('rev-max').textContent=Math.round(max).toLocaleString('ru-RU')+' ₽';
}

/* --- Донат --- */
const CHANNELS=[['Органика',46,'#6366F1'],['Реклама',27,'#22D3EE'],['Соцсети',18,'#F97316'],['Прямые',9,'#1B2333']];
const donut=document.getElementById('donut'); let donutProg=0;
function drawDonut(dt){
  donutProg=Math.min(1,donutProg+dt*1.2);
  const ctx=donut.getContext('2d'), W=donut.width, H=donut.height, cx=W/2, cy=H/2, R=Math.min(W,H)/2-8*DPR, ir=R*0.62;
  ctx.clearRect(0,0,W,H);
  let a=-Math.PI/2;
  CHANNELS.forEach(([name,pct,color])=>{
    const span=pct/100*Math.PI*2*donutProg;
    ctx.beginPath();ctx.arc(cx,cy,R,a,a+span);ctx.arc(cx,cy,ir,a+span,a,true);ctx.closePath();
    ctx.fillStyle=color;ctx.fill();
    a+=pct/100*Math.PI*2*donutProg;
  });
  ctx.fillStyle='#1B2333';ctx.textAlign='center';
  ctx.font=`700 ${20*DPR}px "IBM Plex Sans"`;
  ctx.fillText('100 %',cx,cy+4*DPR);
  document.getElementById('donut-legend').innerHTML=CHANNELS.map(([n,p,c])=>
    `<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${c}"></span><span class="flex-1">${n}</span><b class="num">${p} %</b></div>`).join('');
}

/* --- Лента --- */
const ITEMS=[
  ()=>'покупка · MacBook · 89 900 ₽', ()=>'покупка · Кроссовки · 7 490 ₽',
  ()=>'корзина · Наушники · 12 300 ₽', ()=>'визит · страница /sale',
  ()=>'покупка · Кофемашина · 34 900 ₽', ()=>'лид · заявка на звонок',
  ()=>'покупка · Футболка · 2 990 ₽', ()=>'возврат · заказ №4021'
];
const FEED_COLORS={0:'#10B981',3:'#6366F1',5:'#22D3EE',7:'#E02424'};
let feedTimer=0;
function pushFeed(){
  const feed=document.getElementById('feed');
  const i=Math.floor(Math.random()*ITEMS.length);
  const row=document.createElement('div');
  row.className='feed-row flex items-center gap-3 px-3 py-2 rounded-xl text-sm';
  row.style.background='rgba(255,255,255,.55)';
  row.innerHTML=`<span class="feed-dot" style="background:${FEED_COLORS[i]||'#F59E0B'}"></span><span class="flex-1">${ITEMS[i]()}</span><span class="text-xs num" style="color:#8A93A6">${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span>`;
  feed.prepend(row);
  while(feed.children.length>6) feed.lastChild.remove();
}

/* --- Топ страниц --- */
document.getElementById('pages').innerHTML=[
  ['/',4820,'3,1 %'],['/catalog',3610,'2,4 %'],['/sale',2940,'5,8 %'],['/product/macbook',2100,'6,2 %'],['/blog',890,'0,9 %']
].map(([u,v,c])=>`<tr class="border-t" style="border-color:rgba(27,35,51,.08)"><td class="py-2.5 font-medium">${u}</td><td class="py-2.5 text-right num">${v.toLocaleString('ru-RU')}</td><td class="py-2.5 text-right num">${c}</td></tr>`).join('');

/* --- Пульс live-точки --- */
const pulseKeyframes=document.createElement('style');
pulseKeyframes.textContent='@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}';
document.head.appendChild(pulseKeyframes);

/* --- Цель месяца --- */
function renderGoal(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const total=(30+((y*12+m)%3))// мягкая вариация прогресса
    , day=now.getDate();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const plan=1200000;
  const done=Math.round(plan*(day/daysInMonth)*(0.9+Math.sin(m+day)*0.08));
  const pct=Math.min(100,Math.round(done/plan*100));
  document.getElementById('goal-fill').style.width=pct+'%';
  document.getElementById('goal-now').textContent=done.toLocaleString('ru-RU')+' ₽ · '+pct+' %';
  document.getElementById('goal-days').textContent=Math.max(0,daysInMonth-day);
}
renderGoal();setInterval(renderGoal,30000);

/* --- Пауза при скрытии вкладки --- */
document.addEventListener('visibilitychange',()=>{
  document.body.classList.toggle('paused',document.hidden);
});

/* --- Цикл --- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!document.hidden){
    renderKpis(dt);
    drawRev();
    drawDonut(dt);
    feedTimer+=dt;
    if(feedTimer>4){feedTimer=0;pushFeed();}
    document.getElementById('live-time').textContent=new Date().toLocaleTimeString('ru-RU');
  }
  requestAnimationFrame(loop);
}
function resize(){sizeCanvas(revChart);sizeCanvas(donut);}
window.addEventListener('resize',resize);

resize(); setPeriod(7); pushFeed(); pushFeed(); pushFeed();
requestAnimationFrame(loop);
</script>
</body>
</html>
