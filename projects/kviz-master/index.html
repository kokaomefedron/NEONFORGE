<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>КвизМастер — телестудия</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--studio:#0E1B3D;--yellow:#FFC53D;--red:#E5322B;--floor1:#16306B;--floor2:#0A1530}
  body{background:var(--studio);color:#fff;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .tek{font-family:'Tektur',sans-serif}
  a{color:inherit}

  /* Прожекторы */
  .stage{position:relative;min-height:100vh;display:flex;flex-direction:column}
  .light{position:absolute;top:0;width:220px;height:46vh;pointer-events:none;opacity:.16;
    clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
    background:linear-gradient(180deg,var(--yellow),transparent 85%);
    transform-origin:top center;animation:sway 7s ease-in-out infinite}
  .l1{left:4%}.l2{left:34%;animation-delay:-2.3s}.l3{right:34%;animation-delay:-4.1s}.l4{right:4%;animation-delay:-5.5s}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* Паркет */
  .floor{position:fixed;left:-20%;right:-20%;bottom:0;height:34vh;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,var(--floor1) 0%,var(--floor2) 90%);
    transform:perspective(500px) rotateX(38deg);transform-origin:top;
    box-shadow:inset 0 40px 80px rgba(0,0,0,.5)}
  .floor::before{content:'';position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.08) 79px 81px),
               repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.05) 79px 81px)}
  .floor-glow{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:18vh;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 0,rgba(255,197,61,.22),transparent 70%)}

  .content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:20px 16px 60px;max-width:860px;margin:0 auto;width:100%}

  /* Табло */
  .board{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .board-cell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    padding:8px 16px;border-radius:8px;font-size:13px;letter-spacing:.06em}
  .board-cell b{font-family:'Tektur',sans-serif;color:var(--yellow);font-variant-numeric:tabular-nums}

  /* Таймер-кольцо + суфлёр */
  .top-row{display:flex;align-items:center;gap:18px;margin-top:22px}
  .ring-wrap{flex-shrink:0;position:relative;width:74px;height:74px}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Tektur',sans-serif;font-weight:900;font-size:24px;color:var(--yellow)}
  .teleprompter{flex:1}
  .q-topic{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
  .q-text{font-size:clamp(19px,3.6vw,28px);font-weight:700;line-height:1.35}

  /* Подиумы */
  .podiums{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin-top:auto;padding-top:34px;perspective:700px}
  .pod{position:relative;width:31%;max-width:190px;border:none;cursor:pointer;padding:0;
    background:linear-gradient(180deg,#1D3B82,#142B5E);color:#fff;
    border-top:4px solid var(--yellow);
    transform:rotateX(14deg);transform-origin:bottom;
    clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);
    min-height:118px;transition:transform .15s,filter .2s}
  .pod:hover:not(:disabled){transform:rotateX(14deg) translateY(-6px)}
  .pod .lbl{font-family:'Tektur',sans-serif;font-size:26px;font-weight:900;color:var(--yellow);line-height:1}
  .pod .txt{font-size:clamp(12px,1.6vw,15px);font-weight:600;line-height:1.3;padding:6px 10px 14px}
  .pod:disabled{cursor:default}
  .pod.correct{background:linear-gradient(180deg,#8a6a10,#6b5208);border-top-color:var(--yellow);
    filter:drop-shadow(0 0 22px var(--yellow));animation:flash .5s ease 2}
  .pod.wrong{background:linear-gradient(180deg,#8F2420,#6E1913);border-top-color:var(--red);
    filter:drop-shadow(0 0 18px rgba(229,50,43,.7))}
  .pod.dim{opacity:.45;filter:grayscale(.6)}
  @keyframes flash{50%{filter:brightness(1.6) drop-shadow(0 0 30px var(--yellow))}}

  /* Финал */
  .finale{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px}
  .win-title{font-family:'Tektur',sans-serif;font-size:clamp(34px,8vw,64px);font-weight:900;color:var(--yellow);
    text-shadow:0 0 40px rgba(255,197,61,.4)}
  .confetti{position:fixed;top:-12px;width:9px;height:16px;z-index:1;pointer-events:none;border-radius:2px}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  /* Реакции зала */
  .reaction{position:fixed;bottom:14vh;z-index:30;font-size:30px;pointer-events:none;
    animation:react 1.6s ease forwards}
  @keyframes react{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-20px) scale(1.2)}
    100%{opacity:0;transform:translateY(-160px) scale(.9)}}

  .credit{position:relative;z-index:2;text-align:center;padding:16px;font-size:12px;color:rgba(255,255,255,.5)}
  .credit a{color:var(--yellow);text-decoration:none}
  .credit a:hover{text-decoration:underline}
  .btn-y{min-height:48px;background:var(--yellow);color:var(--studio);border:none;border-radius:10px;
    font-family:'Tektur',sans-serif;font-weight:700;font-size:16px;padding:0 34px;cursor:pointer;
    box-shadow:0 4px 0 #B98A18;transition:transform .1s}
  .btn-y:active{transform:translateY(3px);box-shadow:0 1px 0 #B98A18}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="light l1"></div><div class="light l2"></div><div class="light l3"></div><div class="light l4"></div>
  <div class="floor"></div><div class="floor-glow"></div>

  <!-- Игра -->
  <main class="content" id="game">
    <div class="board">
      <div class="board-cell">Вопрос <b id="b-q">1/10</b></div>
      <div class="board-cell">Счёт <b id="b-score">0</b></div>
      <div class="board-cell">Рекорд <b id="b-best">0</b></div>
    </div>

    <div class="top-row">
      <div class="ring-wrap">
        <svg width="74" height="74" viewBox="0 0 74 74">
          <circle cx="37" cy="37" r="31" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
          <circle id="ring" cx="37" cy="37" r="31" fill="none" stroke="#FFC53D" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-num" id="ring-num">10</div>
      </div>
      <div class="teleprompter">
        <div class="q-topic" id="q-topic"></div>
        <div class="q-text" id="q-text"></div>
      </div>
    </div>

    <div class="podiums" id="podiums">
      <button class="pod" data-i="0"><div class="lbl">А</div><div class="txt"></div></button>
      <button class="pod" data-i="1"><div class="lbl">Б</div><div class="txt"></div></button>
      <button class="pod" data-i="2"><div class="lbl">В</div><div class="txt"></div></button>
    </div>
  </main>

  <!-- Финал -->
  <section class="finale" id="finale" style="display:none">
    <div class="q-topic">ФИНАЛ · РЕЗУЛЬТАТ</div>
    <div class="win-title" id="f-rank"></div>
    <p class="tek" style="font-size:22px;margin-top:10px" id="f-score"></p>
    <p style="color:rgba(255,255,255,.65);margin-top:6px" id="f-note"></p>
    <button class="btn-y" id="btn-again" style="margin-top:34px">НОВАЯ ИГРА</button>
  </section>
</div>

<div class="credit">
  студия от <a href="https://kokaomefedron.github.io/NEONFORGE">NEONFORGE</a>
</div>

<script>
'use strict';
const QS=[
 {t:'Космос',q:'Какая планета Солнечной системы самая горячая?',a:['Меркурий','Венера','Марс'],c:1},
 {t:'Кино',q:'Кто снял фильм «Криминальное чтиво»?',a:['Скорсезе','Тарантино','Нолан'],c:1},
 {t:'Наука',q:'Сколько спутников у Марса?',a:['Один','Два','Ни одного'],c:1},
 {t:'История',q:'В каком году человек впервые вышел в открытый космос?',a:['1963','1965','1969'],c:1},
 {t:'Музыка',q:'Из скольких частей состоит «Времена года» Вивальди?',a:['Из четырёх','Из шести','Из двенадцати'],c:0},
 {t:'География',q:'Какое море самое солёное в мире?',a:['Красное','Мёртвое','Чёрное'],c:1},
 {t:'Технологии',q:'Что означает «HTTP» в адресе сайта?',a:['Протокол передачи','Хост-траф','Формат текста'],c:0},
 {t:'Литература',q:'Кто написал «Мастера и Маргариту»?',a:['Булгаков','Достоевский','Гоголь'],c:0},
 {t:'Биология',q:'Самое большое животное на планете — это…',a:['Африканский слон','Синий кит','Кашалот'],c:1},
 {t:'Спорт',q:'Какая страна принимала ЧМ по футболу 2022 года?',a:['Катар','Россия','Бразилия'],c:0}
];
const LETTERS=['А','Б','В'];
const CIRC=194.8, QTIME=10;

let idx=0, score=0, best=0, timer=QTIME, lock=false;
try{best=+localStorage.getItem('nf_quiz')||0;}catch(e){}

const $=id=>document.getElementById(id);
function setBoard(){
  $('b-q').textContent=(idx+1)+'/'+QS.length;
  $('b-score').textContent=score;
  $('b-best').textContent=best;
}
function showQuestion(){
  lock=false;
  const q=QS[idx];
  $('q-topic').textContent='Тема: '+q.t;
  $('q-text').textContent=q.q;
  $('podiums').querySelectorAll('.pod').forEach((p,i)=>{
    p.className='pod';p.disabled=false;
    p.querySelector('.txt').textContent=q.a[i];
  });
  timer=QTIME;
  $('ring').style.stroke='#FFC53D';
}
function answer(i){
  if(lock) return;
  lock=true;
  const q=QS[idx], pods=[...$('podiums').children];
  pods.forEach(p=>p.disabled=true);
  const ok=i===q.c;
  pods[i].classList.add(ok?'correct':'wrong');
  if(!ok) pods[q.c].classList.add('correct');
  pods.forEach((p,j)=>{if(j!==i&&j!==q.c)p.classList.add('dim');});
  if(ok) score+=10;
  react(ok);
  setBoard();
  setTimeout(()=>{
    idx++;
    if(idx<QS.length) showQuestion();
    else finale();
  },1300);
}
$('podiums').addEventListener('click',e=>{
  const p=e.target.closest('.pod');
  if(p&&!lock) answer(+p.dataset.i);
});

function tick(dt){
  if(document.hidden||lock||idx>=QS.length) return;
  timer-=dt;
  const frac=Math.max(0,timer/QTIME);
  $('ring').style.strokeDashoffset=CIRC*(1-frac);
  $('ring-num').textContent=Math.max(0,Math.ceil(timer));
  if(timer<=3){$('ring').style.stroke='#E5322B';}
  if(timer<=0){lock=true;
    [...$('podiums').children].forEach(p=>{p.disabled=true;p.classList.add('dim');});
    setTimeout(()=>{idx++;idx<QS.length?showQuestion():finale();},800);
  }
}

/* Реакции зала — эмодзи, вылетающие над подиумами */
const GOOD=['👏','🔥','🎉','⭐','😄'], BAD=['😯','😰','😵‍💫'];
function react(good){
  const x=window.innerWidth*0.2+Math.random()*window.innerWidth*0.6;
  const el=document.createElement('div');
  el.className='reaction';
  el.textContent=(good?GOOD:BAD)[Math.floor(Math.random()*(good?GOOD:BAD).length)];
  el.style.left=x+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1700);
}

function finale(){
  $('game').style.display='none';
  const f=$('finale');f.style.display='flex';
  let rank,note;
  if(score>=90){rank='ГРОССМЕЙСТЕР';note='Телезрители аплодируют стоя!';}
  else if(score>=50){rank='ЗНАТОК';note='Очень достойный результат.';}
  else{rank='НОВИЧОК';note='Есть куда расти — попробуйте снова.';}
  $('f-rank').textContent=rank;
  $('f-score').textContent=score+' из 100 очков';
  const isRec=score>best;
  if(isRec){best=score;try{localStorage.setItem('nf_quiz',best);}catch(e){}}
  $('f-note').textContent=isRec?'🏆 Новый рекорд студии!':note;
  setBoard();
  if(score>=50) confetti();
}
function confetti(){
  const colors=['#FFC53D','#E5322B','#fff','#2BD9C8'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%4]};
      animation:fall ${2.2+Math.random()*2.4}s linear ${Math.random()*1.4}s infinite`;
    document.body.appendChild(c);
  }
}
$('btn-again').addEventListener('click',()=>{
  document.querySelectorAll('.confetti').forEach(c=>c.remove());
  idx=0;score=0;timer=QTIME;
  $('finale').style.display='none';
  $('game').style.display='flex';
  setBoard();showQuestion();
});

setBoard();showQuestion();
let last=performance.now();
(function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  tick(dt);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
