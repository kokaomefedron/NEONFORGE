<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Синестезия — аналоговый синтезатор</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chassis:#1B1E24;--chassis2:#22262E;--panel:#15181D;
    --orange:#FF7A1A;--teal:#2BD9C8;--violet:#8B7BFF;
    --txt:#C9CDD6;--led-off:#3A2126;--screw:#2E333C
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0D0F12;color:var(--txt);font-family:'Chakra Petch',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px;
    -webkit-tap-highlight-color:transparent}
  .synth{width:min(860px,100%);background:
      linear-gradient(180deg,#232830 0%,var(--chassis) 8%,var(--chassis) 92%,#14161A 100%);
    border-radius:14px;border:1px solid #000;
    box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
    padding:22px clamp(12px,3vw,30px) 26px}
  /* шильдик и винты */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{background:linear-gradient(180deg,#3A404B,#23262D);padding:6px 16px;border-radius:4px;
    border:1px solid #0A0B0D;font-weight:700;letter-spacing:.28em;font-size:15px;color:#E8EAEF;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .logo b{color:var(--orange)}
  .badge{font-size:10px;letter-spacing:.15em;color:#6E747F;border:1px solid #2A2E36;
    padding:3px 8px;border-radius:3px}
  .badge a{color:var(--teal);text-decoration:none}
  .badge a:hover{text-decoration:underline}
  .screw{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4A5058,var(--screw));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.2);position:relative;flex-shrink:0}
  .screw::after{content:'';position:absolute;left:50%;top:1px;bottom:1px;width:1.5px;background:#121417;transform:translateX(-50%) rotate(35deg)}
  .screw.s2::after{transform:translateX(-50%) rotate(-20deg)}

  .modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .module{background:var(--panel);border:1px solid #0A0B0D;border-radius:8px;padding:12px 12px 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.4)}
  .module h2{font-size:10px;letter-spacing:.3em;color:#7A8089;text-align:center;margin-bottom:10px;
    border-bottom:1px solid #262A31;padding-bottom:6px}
  .module h2 span{color:var(--orange)}
  .module.m-filter h2 span{color:var(--teal)}
  .module.m-env h2 span{color:var(--violet)}

  /* Пэды */
  .pads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pad{min-height:52px;border:none;border-radius:6px;cursor:pointer;position:relative;
    font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;color:#E8EAEF;
    background:linear-gradient(180deg,#2E333C,#1D2128);
    box-shadow:0 3px 0 #0C0D10,inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .06s,box-shadow .06s}
  .pad .led{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;
    background:var(--led-off);transition:all .1s}
  .pad:active,.pad.on{transform:translateY(2px);box-shadow:0 1px 0 #0C0D10,inset 0 1px 0 rgba(255,255,255,.08)}
  .pad.c .led.on-l{background:var(--orange);box-shadow:0 0 8px var(--orange)}
  .pad.e .led.on-l{background:var(--teal);box-shadow:0 0 8px var(--teal)}
  .pad.g .led.on-l{background:var(--violet);box-shadow:0 0 8px var(--violet)}
  .pad.a .led.on-l{background:#FFD60A;box-shadow:0 0 8px #FFD60A}
  .pad small{display:block;font-size:9px;font-weight:400;color:#7A8089;letter-spacing:.1em}

  /* Слайдеры */
  .sliders{display:flex;gap:14px;justify-content:center;align-items:stretch}
  .sl{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
  .sl label{font-size:9px;letter-spacing:.15em;color:#7A8089}
  .sl output{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--teal);
    background:#0D0F12;padding:2px 8px;border-radius:3px;border:1px solid #262A31;min-width:44px;text-align:center}
  .sl input[type=range]{-webkit-appearance:none;appearance:none;width:26px;height:96px;
    background:linear-gradient(180deg,#0A0B0D,#17191F);border-radius:13px;border:1px solid #000;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);cursor:pointer;writing-mode:vertical-lr;direction:rtl}
  .sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:20px;border-radius:4px;
    background:linear-gradient(180deg,#3C424C,#23262D);
    border:1px solid #0A0B0D;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
    position:relative}
  .sl input[type=range]::-webkit-slider-thumb::after{content:''}
  .sl input[type=range]::-moz-range-thumb{width:34px;height:20px;border-radius:4px;
    background:linear-gradient(180deg,#3C424C,#23262D);border:1px solid #0A0B0D}
  .sl.teal-thumb output{color:var(--teal)}
  .sl.violet-thumb output{color:var(--violet)}
  .sl.orange-thumb output{color:var(--orange)}
  .thumb-teal::-webkit-slider-thumb{border-top:3px solid var(--teal)}
  .thumb-violet::-webkit-slider-thumb{border-top:3px solid var(--violet)}
  .thumb-orange::-webkit-slider-thumb{border-top:3px solid var(--orange)}

  /* Светодиодная шкала master */
  .leds{display:flex;gap:3px;margin-top:8px;justify-content:center}
  .leds i{width:5px;height:9px;border-radius:1px;background:#24282F}
  .leds i.on{background:#33D17A;box-shadow:0 0 5px #33D17A}

  /* Осциллограф */
  .scope{margin-top:14px;background:#0B0D10;border:1px solid #0A0B0D;border-radius:8px;
    padding:10px;box-shadow:inset 0 2px 10px rgba(0,0,0,.6)}
  .scope h2{font-size:10px;letter-spacing:.3em;color:#7A8089;margin-bottom:6px;display:flex;justify-content:space-between}
  .scope h2 span{color:var(--teal);font-family:ui-monospace,monospace}
  canvas{display:block;width:100%;border-radius:4px}
  .note{margin-top:10px;text-align:center;font-size:11px;color:#5A6068}
</style>
</head>
<body>

<div class="synth">
  <div class="top">
    <div class="screw"></div>
    <div class="brand">
      <div class="logo">SINE<b>ST</b>EZIA-1</div>
      <div class="badge">АНАЛОГОВЫЙ СИНТЕЗАТОР</div>
      <div class="badge">синтез от <a href="https://kokaomefedron.github.io/NEONFORGE">NEONFORGE</a></div>
    </div>
    <div class="screw s2"></div>
  </div>

  <div class="modules">
    <div class="module">
      <h2><span>OSC</span> · ИСТОЧНИК</h2>
      <div class="pads">
        <button class="pad c" data-note="261.63"><span class="led"></span>C<small>440·1/1</small></button>
        <button class="pad e" data-note="329.63"><span class="led"></span>E<small>терция</small></button>
        <button class="pad g" data-note="392.00"><span class="led"></span>G<small>квинта</small></button>
        <button class="pad a" data-note="440.00"><span class="led"></span>A<small>октава+</small></button>
      </div>
    </div>

    <div class="module m-filter">
      <h2>FILTER · <span>СРЕЗ</span></h2>
      <div class="sliders">
        <div class="sl teal-thumb">
          <output id="o-cut">800</output>
          <input type="range" id="r-cut" min="120" max="4000" value="800" class="thumb-teal">
          <label>CUTOFF</label>
        </div>
        <div class="sl">
          <output id="o-res" style="color:#8A93A6">6</output>
          <input type="range" id="r-res" min="0" max="20" value="6">
          <label>RES</label>
        </div>
      </div>
    </div>

    <div class="module m-env">
      <h2>ENV · <span>ОГИБАЮЩАЯ</span></h2>
      <div class="sliders">
        <div class="sl violet-thumb">
          <output id="o-att" style="color:var(--violet)">10</output>
          <input type="range" id="r-att" min="0" max="300" value="10" class="thumb-violet">
          <label>ATT</label>
        </div>
        <div class="sl violet-thumb">
          <output id="o-rel" style="color:var(--violet)">400</output>
          <input type="range" id="r-rel" min="50" max="1500" value="400" class="thumb-violet">
          <label>REL</label>
        </div>
      </div>
    </div>

    <div class="module">
      <h2><span>MASTER</span> · ГРОМКОСТЬ</h2>
      <div class="sliders">
        <div class="sl orange-thumb" style="flex:2">
          <output id="o-vol" style="color:var(--orange)">60</output>
          <input type="range" id="r-vol" min="0" max="100" value="60" class="thumb-orange">
          <label>VOL</label>
        </div>
      </div>
      <div class="leds" id="leds"></div>
    </div>
  </div>

  <div class="scope">
    <h2>ОСЦИЛЛОГРАФ <span id="scope-state">STANDBY</span></h2>
    <canvas id="scope-cv" height="130"></canvas>
  </div>

  <p class="note">Звук включается при первом касании пэда · удерживайте пэд для ноты</p>
</div>

<script>
'use strict';
const DPR=Math.min(window.devicePixelRatio||1,2);

/* --- Web Audio (лениво) --- */
let AC=null, master=null, filter=null, analyser=null;
function initAudio(){
  if(AC) return true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();
    master.gain.value=+rVol.value/100*0.35;
    filter=AC.createBiquadFilter();
    filter.type='lowpass';
    filter.frequency.value=+rCut.value;
    filter.Q.value=+rRes.value;
    analyser=AC.createAnalyser();
    analyser.fftSize=2048;
    filter.connect(master); master.connect(analyser); analyser.connect(AC.destination);
    document.getElementById('scope-state').textContent='ACTIVE';
    return true;
  }catch(e){return false;}
}
const rCut=document.getElementById('r-cut'), rRes=document.getElementById('r-res'),
      rAtt=document.getElementById('r-att'), rRel=document.getElementById('r-rel'),
      rVol=document.getElementById('r-vol');
function bind(r,o,fmt){
  r.addEventListener('input',()=>{
    o.textContent=fmt(+r.value);
    if(AC){
      if(r===rCut) filter.frequency.setTargetAtTime(+r.value,AC.currentTime,0.03);
      if(r===rRes) filter.Q.setTargetAtTime(+r.value,AC.currentTime,0.03);
      if(r===rVol) master.gain.setTargetAtTime(+r.value/100*0.35,AC.currentTime,0.03);
    }
    if(r===rVol) renderLeds();
  });
}
bind(rCut,document.getElementById('o-cut'),v=>v);
bind(rRes,document.getElementById('o-res'),v=>v);
bind(rAtt,document.getElementById('o-att'),v=>v+'ms');
bind(rRel,document.getElementById('o-rel'),v=>v+'ms');
bind(rVol,document.getElementById('o-vol'),v=>v);

/* LED-шкала громкости */
const leds=document.getElementById('leds');
for(let i=0;i<10;i++){leds.appendChild(document.createElement('i'));}
function renderLeds(){
  const lvl=Math.round(+rVol.value/10);
  [...leds.children].forEach((el,i)=>el.classList.toggle('on',i<lvl));
}
renderLeds();

/* --- Пэды: нота с ADSR --- */
const held=new Map();
function noteOn(freq,el){
  if(!initAudio()) return;
  if(AC.state==='suspended') AC.resume();
  if(held.has(freq)) return;
  const t=AC.currentTime;
  const osc=AC.createOscillator();
  osc.type='sawtooth';
  osc.frequency.value=freq;
  const det=AC.createOscillator();          // второй осциллятор — толщина
  det.type='square'; det.frequency.value=freq/2;
  const detG=AC.createGain(); detG.gain.value=0.4;
  const g=AC.createGain(); g.gain.value=0;
  osc.connect(g); det.connect(detG); detG.connect(g); g.connect(filter);
  const att=Math.max(0.005,+rAtt.value/1000);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.32,t+att);            // attack
  g.gain.setTargetAtTime(0.22,t+att,0.4);                // лёгкий спад к sustain
  osc.start();det.start();
  const voice={osc,det,g};
  held.set(freq,voice);
  el.classList.add('on'); el.querySelector('.led').classList.add('on-l');
}
function noteOff(freq,el){
  const v=held.get(freq);
  if(!v) return;
  held.delete(freq);
  const t=AC.currentTime, rel=Math.max(0.05,+rRel.value/1000);
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(v.g.gain.value,t);
  v.g.gain.linearRampToValueAtTime(0,t+rel);             // release
  v.osc.stop(t+rel+0.05); v.det.stop(t+rel+0.05);
  el.classList.remove('on'); el.querySelector('.led').classList.remove('on-l');
}
document.querySelectorAll('.pad').forEach(pad=>{
  const freq=+pad.dataset.note;
  const down=e=>{e.preventDefault();noteOn(freq,pad);};
  const up=()=>noteOff(freq,pad);
  pad.addEventListener('pointerdown',down);
  pad.addEventListener('pointerup',up);
  pad.addEventListener('pointerleave',up);
  pad.addEventListener('pointercancel',up);
  pad.addEventListener('contextmenu',e=>e.preventDefault());
});
addEventListener('blur',()=>{document.querySelectorAll('.pad.on').forEach(p=>{
  const v=held.get(+p.dataset.note); if(v){noteOff(+p.dataset.note,p);}
});});

/* --- Осциллограф --- */
const cv=document.getElementById('scope-cv');
function size(){const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*DPR);cv.height=130*DPR;}
size();addEventListener('resize',size);
const buf=new Uint8Array(1024);
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  requestAnimationFrame(loop);
  if(document.hidden) return;
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  /* сетка */
  ctx.strokeStyle='rgba(43,217,200,.08)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=W/12){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=H/4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='rgba(43,217,200,.25)';
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  /* волна */
  ctx.lineWidth=2*DPR;ctx.strokeStyle='#2BD9C8';
  ctx.shadowColor='rgba(43,217,200,.6)';ctx.shadowBlur=6*DPR;
  ctx.beginPath();
  if(analyser){
    analyser.getByteTimeDomainData(buf);
    for(let i=0;i<buf.length;i++){
      const x=i/buf.length*W, y=(buf[i]/255)*H;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
  }else{
    for(let x=0;x<=W;x+=4){                    // standby — плоская линия с шумом
      const y=H/2+Math.sin(x*0.05+now*0.002)*3*DPR;
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
  }
  ctx.stroke();ctx.shadowBlur=0;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
